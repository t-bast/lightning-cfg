eclair.chain = "regtest"
eclair.node-alias=bob
eclair.server.port=9736

eclair.trampoline-payments-enable=true
# eclair.features.zero_fee_commitments = optional
# eclair.features.option_simple_taproot_staging = optional

# Faster gossip broadcast.
eclair.router.broadcast-interval = 1 second

# Faster channel updates.
eclair.channel.channel-update.min-time-between-updates = 60 seconds
eclair.channel.channel-update.balance-thresholds = []

# Faster watches on restart.
eclair.router.watch-spent-window = 10 seconds

eclair.liquidity-ads.funding-rates = [
    {
        min-funding-amount-satoshis = 100000
        max-funding-amount-satoshis = 250000
        funding-weight = 400
        fee-base-satoshis = 500
        fee-basis-points = 250
        channel-creation-fee-satoshis = 2500
    },
    {
      min-funding-amount-satoshis = 250000
      max-funding-amount-satoshis = 500000
      funding-weight = 750
      fee-base-satoshis = 1000
      fee-basis-points = 200 // 2%
      channel-creation-fee-satoshis = 2000
    }
]

eclair.balance-check-interval = 48 hours

eclair.channel.min-depth-blocks = 10
# eclair.channel.dust-limit-satoshis = 4000
# eclair.channel.max-remote-dust-limit-satoshis = 10000
eclair.channel.htlc-minimum-msat = 500
eclair.channel.max-htlc-value-in-flight-msat = 75000000
eclair.channel.max-htlc-value-in-flight-percent = 25
eclair.channel.max-accepted-htlcs = 15
eclair.channel.to-remote-delay-blocks = 100

eclair.api.enabled=true
eclair.api.port=9001
eclair.api.password=password

eclair.bitcoind.rpcport=18443
eclair.bitcoind.rpcuser=user
eclair.bitcoind.rpcpassword=password
eclair.bitcoind.zmqblock="tcp://127.0.0.1:29000"
eclair.bitcoind.zmqtx="tcp://127.0.0.1:29001"